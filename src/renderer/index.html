<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>OpsDeck — Operations Studio</title>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/academy.css">
  <link rel="stylesheet" href="./styles/databases.css">
  <link rel="stylesheet" href="./styles/observability.css">
  <link rel="stylesheet" href="./styles/intelligence.css">
  <link rel="stylesheet" href="./styles/help.css">
  <link rel="stylesheet" href="./styles/rtl.css">
  <link rel="stylesheet" href="./vendor/xterm.css">
</head>
<body>
  <div class="app" id="app" data-collapsed="false">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="main-body" id="main-body">
      <main class="content" id="content" tabindex="-1">
        <div class="content-inner" id="view">
          <div class="boot-screen">
            <div class="brand-mark boot-mark" aria-hidden="true"></div>
            <div>
              <div class="boot-title">OpsDeck</div>
              <div class="boot-sub">Starting Operations Studio…</div>
            </div>
            <div class="boot-bar"><i></i></div>
          </div>
        </div>
      </main>
      <aside class="help-dock" id="help-dock" aria-label="Help" hidden></aside>
      </div>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="palette-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="./js/i18n.js" defer></script>
  <script src="./js/i18n/fa-1.js" defer></script>
  <script src="./js/i18n/fa-2.js" defer></script>
  <script src="./js/i18n/fa-3.js" defer></script>
  <script src="./js/i18n/fa-4.js" defer></script>
  <script src="./js/i18n/fa-5.js" defer></script>
  <script src="./js/i18n/fa-6.js" defer></script>
  <script src="./js/i18n/fa-7.js" defer></script>
  <script src="./js/i18n/fa-8.js" defer></script>
  <script src="./js/i18n/fa-9.js" defer></script>
  <script src="./js/i18n/fa-10.js" defer></script>
  <script src="./js/icons.js" defer></script>
  <script src="./js/utils.js" defer></script>
  <script src="./js/charts.js" defer></script>
  <script src="./js/ui.js" defer></script>
  <script src="./js/store.js" defer></script>
  <script src="./js/ai.js" defer></script>
  <script src="./js/log-viewer.js" defer></script>
  <script src="./js/docker-views.js" defer></script>
  <script src="./js/kubernetes-topology.js" defer></script>
  <script src="./js/kubernetes-views.js" defer></script>
  <script src="./js/databases-views.js" defer></script>
  <script src="./js/observability-views.js" defer></script>
  <script src="./js/intelligence-views.js" defer></script>
  <script src="./js/insights-views.js" defer></script>
  <script src="./js/line-help.js" defer></script>
  <script src="./js/academy-views.js" defer></script>
  <script src="./js/help-views.js" defer></script>
  <script src="./js/app.js" defer></script>
  <!-- Help articles (js/help/*, js/help-fa/*) and the xterm renderer are
       loaded on first use by OD.utils.loadScripts, which keeps startup light. -->
</body>
</html>
